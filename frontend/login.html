<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Destiny Coffee</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <img src="img/Logo.png" alt="Destiny Coffee Logo" class="logo">
            <h1>Log In</h1>
            <form id="loginForm" method="POST">
                <div class="input-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="username" placeholder="Ingresa tu usuario" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                </div>
                <button type="submit">Iniciar Sesión</button>
                <div id="loginError" style="color: #FF6B6B; margin-top: 10px; font-weight: 600;"></div>
            </form>
            <p class="footer">© 2025 Destiny Coffee</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorDiv = document.getElementById('loginError');

        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Evita que la página se recargue

            const formData = new FormData(form);

            fetch('/login', {
                method: 'POST',
                body: formData
            })
            .then(res => res.text())
            .then(data => {
                // Si el login devuelve el mensaje de error, lo mostramos
                if (data.includes('incorrectos')) {
                    errorDiv.textContent = "Usuario o contraseña incorrectos";
                } else {
                    // Redirige si login fue exitoso
                    window.location.href = '/main.html';
                }
            })
            .catch(err => {
                errorDiv.textContent = "Error en la conexión, intenta de nuevo";
            });
        });
    </script>
</body>
</html>
